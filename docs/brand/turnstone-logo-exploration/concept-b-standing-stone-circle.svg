<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" class="theme-dark" role="img" aria-labelledby="title desc">
  <title id="title">The standing-stone circle emblem</title>
  <desc id="desc">Four equal upright stones enclose a low round table.</desc>
  <style>
    .theme-dark { --ink: #FAFAF5; --accent: #C8944A; }
    .theme-light { --ink: #3D3A38; --accent: #C8944A; }
    .mono-dark { --ink: #FAFAF5; --accent: #FAFAF5; }
    .mono-light { --ink: #3D3A38; --accent: #3D3A38; }
    .stone { fill: var(--ink); }
  </style>
  <g transform="translate(4 0)" class="stone">
    <rect x="24" y="1" width="8" height="17" rx="4"/>
    <rect x="24" y="45" width="8" height="17" rx="4"/>
    <rect x="1" y="23" width="8" height="17" rx="4"/>
    <rect x="47" y="23" width="8" height="17" rx="4"/>
    <circle cx="28" cy="32" r="7"/>
  </g>
</svg>
