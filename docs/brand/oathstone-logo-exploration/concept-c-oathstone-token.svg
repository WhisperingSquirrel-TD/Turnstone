<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" class="theme-dark" role="img" aria-labelledby="title desc">
  <title id="title">The oathstone token emblem</title>
  <desc id="desc">Three equal rounded stones step around a central pivot, forming a compact circular token.</desc>
  <style>
    .theme-dark { --ink: #FAFAF5; --accent: #C8944A; }
    .theme-light { --ink: #3D3A38; --accent: #C8944A; }
    .mono-dark { --ink: #FAFAF5; --accent: #FAFAF5; }
    .mono-light { --ink: #3D3A38; --accent: #3D3A38; }
    .stone { fill: var(--ink); }
  </style>
  <g transform="translate(4 0)" class="stone">
    <rect x="20" y="2" width="16" height="9" rx="4.5"/>
    <rect x="20" y="2" width="16" height="9" rx="4.5" transform="rotate(120 28 32)"/>
    <rect x="20" y="2" width="16" height="9" rx="4.5" transform="rotate(240 28 32)"/>
  </g>
</svg>
