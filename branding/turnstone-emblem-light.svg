<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Eight-stone circle mark</title>
  <desc id="desc">Eight equal rounded stones form a circle, with one gold-brown stone at about one-thirty.</desc>
  <style>
    .seat { fill: #3D3A38; }
    .seat-accent { fill: #9A672B; }
  </style>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(0 28 28)"/>
  <rect class="seat seat-accent" x="24" y="5" width="8" height="12" rx="4" transform="rotate(45 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(90 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(135 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(180 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(225 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(270 28 28)"/>
  <rect class="seat" x="24" y="5" width="8" height="12" rx="4" transform="rotate(315 28 28)"/>
</svg>
