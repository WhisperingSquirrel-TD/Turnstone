kind = "web"
previewPath = "/"
title = "Oathstone"
description = "Oathstone is a website-only hidden-role party game by Stackstone Consulting, designed for groups playing together on phones and tablets."
version = "1.0.0"
id = "artifacts/party-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22814

[services.development]
run = "pnpm --filter @workspace/party-game run dev"

# No production service: the api-server process serves the built client
# (D115). These settings drive the development preview only.

[services.env]
PORT = "22814"
BASE_PATH = "/"
