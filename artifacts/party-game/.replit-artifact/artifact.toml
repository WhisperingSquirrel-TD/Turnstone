kind = "web"
previewPath = "/"
title = "Turnstone"
description = "Turnstone is a website-only hidden-role party game by Stackstone Consulting, designed for groups playing together on phones and tablets."
version = "1.0.0"
id = "artifacts/party-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22814

[services.development]
run = "pnpm --filter @workspace/party-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/party-game", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/party-game", "run", "serve" ]


[services.env]
PORT = "22814"
BASE_PATH = "/"
