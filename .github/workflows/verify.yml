name: Verify
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download and verify pinned Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 "$release_url/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          awk -v asset="$archive" '$2 == asset { print }' "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/gitleaks-checksum.txt"
          test "$(wc -l < "$RUNNER_TEMP/gitleaks-checksum.txt")" -eq 1
          test "$(awk '{ print $1 }' "$RUNNER_TEMP/gitleaks-checksum.txt")" = "$GITLEAKS_LINUX_X64_SHA256"
          (cd "$RUNNER_TEMP" && sha256sum --check --strict gitleaks-checksum.txt)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete Git history for leaked secrets
        run: gitleaks git --redact --log-opts="--all" .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks and production build
        run: |
          pnpm run typecheck
          pnpm run typecheck:tests
          pnpm run lint
          pnpm run format:check
          pnpm run test:build

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:build
      - name: Create isolated test PIN pepper
        shell: bash
        run: |
          pin_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$pin_pepper"
          echo "PIN_PEPPER=$pin_pepper" >> "$GITHUB_ENV"
      - run: pnpm run test:unit

  property:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:property

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: oathstone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/oathstone_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated test session secret
        shell: bash
        run: |
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "SESSION_SECRET=$value" >> "$GITHUB_ENV"
          pin_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$pin_pepper"
          echo "PIN_PEPPER=$pin_pepper" >> "$GITHUB_ENV"
      - run: pnpm run db:migrate:dev
      - name: Run integration tests with the 85% server coverage gate
        run: pnpm run test:server-coverage

  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shardIndex: 0
            shardCount: 6
          - shardIndex: 1
            shardCount: 6
          - shardIndex: 2
            shardCount: 6
          - shardIndex: 3
            shardCount: 6
          - shardIndex: 4
            shardCount: 6
          - shardIndex: 5
            shardCount: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify scenario sample and worker isolation
        run: |
          pnpm run test:scenario-workers
          mkdir -p generated-artifacts/scenario-shards
          pnpm --filter @workspace/scripts run scenarios -- --shard-index="${{ matrix.shardIndex }}" --shard-count="${{ matrix.shardCount }}" --partial-report="generated-artifacts/scenario-shards/shard-${{ matrix.shardIndex }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scenario-shard-${{ matrix.shardIndex }}
          path: generated-artifacts/scenario-shards/shard-${{ matrix.shardIndex }}.json
          if-no-files-found: error
          retention-days: 1

  merge-scenario-reports:
    if: always()
    needs: [scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scenario-shard-*
          merge-multiple: true
          path: generated-artifacts/scenario-shards
      - name: Verify shard coverage and write the merged scenario report
        run: pnpm --filter @workspace/scripts run scenarios:merge -- --reports-dir=generated-artifacts/scenario-shards --output=docs/SCENARIO_REPORT.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: scenario-report
          path: docs/SCENARIO_REPORT.md
          retention-days: 7

  browsers:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: iPhone
            browser: webkit
          - profile: Pixel
            browser: chromium
          - profile: iPad
            browser: webkit
          - profile: desktop
            browser: chromium
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the ${{ matrix.profile }} smoke profile
        run: pnpm exec playwright test --project="${{ matrix.profile }}" --grep-invert @rehearsal-live

  rehearsal-live:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: oathstone_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@postgres:5432/oathstone_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated test session secret
        shell: bash
        run: |
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "SESSION_SECRET=$value" >> "$GITHUB_ENV"
          pin_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$pin_pepper"
          echo "PIN_PEPPER=$pin_pepper" >> "$GITHUB_ENV"
      - run: pnpm run db:migrate:dev
      - name: Run full real-server Pixel rehearsal
        run: pnpm exec playwright test --config=playwright.rehearsal.config.ts
      - name: Upload rehearsal diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: generated-artifacts/playwright-rehearsal
          if-no-files-found: warn
          retention-days: 3

  lighthouse:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:bc72a8df40831ded821e3cbc79c318c21b44d6e51dff9fd89ace7a8249c5b462
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:build
      - name: Isolated test session secret
        shell: bash
        run: |
          value="$(openssl rand -hex 32)"
          echo "::add-mask::$value"
          echo "SESSION_SECRET=$value" >> "$GITHUB_ENV"
          pin_pepper="$(openssl rand -hex 32)"
          echo "::add-mask::$pin_pepper"
          echo "PIN_PEPPER=$pin_pepper" >> "$GITHUB_ENV"
      - run: pnpm run test:accessibility

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit

  required-checks:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    needs:
      - static-checks
      - unit
      - property
      - integration
      - rehearsal-live
      - scenarios
      - merge-scenario-reports
      - browsers
      - lighthouse
      - audit
    steps:
      - name: Require every verification suite
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.JOB_RESULTS); const failures = Object.entries(results).filter(([, job]) => job.result !== "success"); if (failures.length) { console.error(failures.map(([name, job]) => `${name}: ${job.result}`).join("\n")); process.exit(1); }'
